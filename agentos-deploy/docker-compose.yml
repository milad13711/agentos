# Place this file in the PARENT folder that contains both agentos-backend/
# and agentos-web/ (e.g. ~/Documents/agent-os-project/docker-compose.yml).
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down            (stops containers, keeps data volume)
#   docker compose down -v         (also deletes the SQLite data volume — careful)

services:
  backend:
    build: ./agentos-backend
    restart: unless-stopped
    environment:
      - PORT=8787
      - AGENTOS_DB_PATH=/app/data/agentos.sqlite
      # Leave DATABASE_URL unset (the default) to keep using SQLite — fine
      # for a single instance, and what production runs today. Set it (and
      # uncomment the `postgres` service + `depends_on` below) only once you
      # actually need more than one backend instance; src/db.js switches to
      # Postgres automatically whenever this is non-empty. See
      # agentos-deploy/DEPLOY.md "PostgreSQL migration checklist" before
      # flipping this on a database with real data in it.
      - DATABASE_URL=${DATABASE_URL:-}
      - AGENTOS_TOKEN_SECRET=${AGENTOS_TOKEN_SECRET:?set a long random secret in .env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AGENTOS_MODEL=${AGENTOS_MODEL:-claude-sonnet-4-6}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      # Voice (STT/TTS) — a separate, real, direct OpenAI key from
      # OPENAI_API_KEY above (that one's usually GapGPT). Empty = voice off.
      - OPENAI_VOICE_API_KEY=${OPENAI_VOICE_API_KEY:-}
      - OPENAI_VOICE_BASE_URL=${OPENAI_VOICE_BASE_URL:-}
      - OPENAI_STT_MODEL=${OPENAI_STT_MODEL:-}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-}
      - OPENAI_TTS_VOICE=${OPENAI_TTS_VOICE:-}
      # Web Push (browser/PWA) notifications — generate a pair once with
      # `node -e "console.log(require('web-push').generateVAPIDKeys())"`.
      # Empty = push disabled, no crash.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Only needed if api.telegram.org is filtered from this server (it is,
      # from Iran) — routes Telegram API calls through a SOCKS5 proxy instead.
      # If your proxy is a vmess:// link (V2Ray/Xray, not a raw SOCKS5 URL),
      # use the `xray` service below instead: set TELEGRAM_VMESS_LINK in
      # .env and point this at socks5://xray:1080 — see its comment block.
      - TELEGRAM_SOCKS_PROXY=${TELEGRAM_SOCKS_PROXY:-}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID:-}
      - ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX:-1}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:?set your real public domain, e.g. https://exirsms.ir}
    volumes:
      - agentos_data:/app/data
    networks: [agentos]
    # Not exposed to the host on purpose — only the "web" service and Caddy
    # talk to it, over the internal Docker network. The AI key never needs
    # to leave this container.
    depends_on: [xray]
    # Uncomment once DATABASE_URL above points at the `postgres` service:
    # depends_on: [postgres]

  # Local SOCKS5 proxy fronting a vmess:// (V2Ray/Xray) connection, for when
  # api.telegram.org is network-filtered where this server runs (confirmed
  # true for at least one Iran-hosted deployment — DNS for api.telegram.org
  # resolves to a private address even via 8.8.8.8, which is network-level
  # interception, not a local misconfiguration). Always running, but a no-op
  # (just sleeps) if TELEGRAM_VMESS_LINK isn't set — harmless either way.
  # Set TELEGRAM_VMESS_LINK in .env (the vmess:// share-link from your
  # provider — never commit this, .env isn't tracked by git) and
  # TELEGRAM_SOCKS_PROXY=socks5://xray:1080 above to route through it.
  xray:
    # Built from source (downloads the official XTLS/Xray-core release from
    # GitHub) instead of pulling docker.io/teddysun/xray — that specific
    # image 403'd pulling from the production server, while Docker Hub's own
    # official images (node:22-alpine, alpine) pull fine, so this sidesteps
    # whatever that block actually was rather than depending on it lifting.
    build: ./xray
    restart: unless-stopped
    environment:
      - TELEGRAM_VMESS_LINK=${TELEGRAM_VMESS_LINK:-}
    networks: [agentos]
    # Not exposed to the host — only "backend" reaches it, at xray:1080.

  # Optional — only needed once you're actually running more than one
  # backend instance (SQLite is a single local file, fine until then).
  # To switch: set DATABASE_URL=postgres://agentos:${POSTGRES_PASSWORD}@postgres:5432/agentos
  # in .env, uncomment this service and backend's `depends_on` above, run
  # `docker compose up -d --build`, then migrate existing data with
  # `docker compose exec backend node scripts/migrate-sqlite-to-postgres.js`
  # (point AGENTOS_DB_PATH at the old SQLite volume for that one run).
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=agentos
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a real password in .env}
  #     - POSTGRES_DB=agentos
  #   volumes:
  #     - agentos_postgres_data:/var/lib/postgresql/data
  #   networks: [agentos]
  #   # Not exposed to the host, same reasoning as backend: only reachable
  #   # from other containers on the internal network.
  #   # Deliberately NOT mounting schema-postgres.sql as a docker-entrypoint
  #   # init script: src/db.js already creates every table itself on boot
  #   # (CREATE TABLE IF NOT EXISTS, no RLS) — schema-postgres.sql additionally
  #   # documents Row-Level Security policies that are NOT wired to the app's
  #   # connections yet (see the comment at the top of that file); running it
  #   # verbatim here would silently enable RLS and break login/cross-tenant
  #   # reads the app doesn't yet set session variables for.

  web:
    build: ./agentos-web
    restart: unless-stopped
    environment:
      - AGENTOS_API_URL=http://backend:8787
      - NODE_ENV=production
    depends_on: [backend]
    networks: [agentos]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [agentos]

networks:
  agentos:

volumes:
  agentos_data:   # the SQLite database — this is your real business data, back it up
  caddy_data:     # TLS certificates (auto-renewed by Caddy)
  caddy_config:
  agentos_postgres_data:  # only used once the optional `postgres` service above is enabled
