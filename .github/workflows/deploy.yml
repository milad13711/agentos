name: Deploy to production

# Replaces the manual SSH + git pull + rsync + docker compose loop
# (see CLAUDE.md gotcha #8) with the same steps, automated, gated on a
# real build first so a broken commit never reaches the server.
#
# Requires these repository secrets (Settings > Secrets and variables >
# Actions), see docs/ci-cd-setup.md for exactly how to set them up:
#   DEPLOY_HOST     - 94.182.93.52
#   DEPLOY_USER     - the SSH user (root, unless you set up a dedicated one)
#   DEPLOY_SSH_KEY  - private half of a dedicated deploy keypair

on:
  push:
    branches: [claude/agentos-phase-0-1-setup-vcjcz8]
  workflow_dispatch: {}

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build agentos-web
        working-directory: agentos-web
        run: |
          npm ci
          npm run build

      - name: Install agentos-backend dependencies
        working-directory: agentos-backend
        run: npm ci

      - name: Syntax-check agentos-backend
        working-directory: agentos-backend
        run: |
          for f in src/*.js scripts/*.js; do node --check "$f"; done

      - name: Run agentos-backend tests
        working-directory: agentos-backend
        run: npm test

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"

            if [ -d ~/agentos-src/.git ]; then
              cd ~/agentos-src
              git fetch origin
              git reset --hard "origin/$BRANCH"
            else
              git clone -b "$BRANCH" https://github.com/milad13711/agentos.git ~/agentos-src
            fi

            rsync -a --delete ~/agentos-src/agentos-backend/ ~/agentos-backend/ --exclude data
            rsync -a --delete ~/agentos-src/agentos-web/ ~/agentos-web/

            # docker-compose.yml and Caddyfile live outside agentos-backend/
            # and agentos-web/, so the rsyncs above never touched them —
            # editing them in the repo used to silently not reach the server.
            # Now they're kept in sync too: the repo (agentos-deploy/) is the
            # source of truth, so any manual edit made directly on the server
            # to ~/docker-compose.yml or ~/Caddyfile will be OVERWRITTEN on
            # the next deploy — make those edits in agentos-deploy/ instead.
            CADDY_BEFORE=""
            [ -f ~/Caddyfile ] && CADDY_BEFORE=$(md5sum ~/Caddyfile | awk '{print $1}')

            rsync -a ~/agentos-src/agentos-deploy/docker-compose.yml ~/docker-compose.yml
            rsync -a ~/agentos-src/agentos-deploy/Caddyfile ~/Caddyfile

            CADDY_AFTER=$(md5sum ~/Caddyfile | awk '{print $1}')

            cd ~
            docker compose up -d --build

            # Compose only recreates a service when ITS OWN definition
            # changes — it never notices a volume-mounted file (Caddyfile)
            # changing on disk, so Caddy has to be told explicitly.
            if [ "$CADDY_BEFORE" != "$CADDY_AFTER" ]; then
              echo "Caddyfile changed — restarting caddy to pick it up"
              docker compose restart caddy
            fi

            sleep 8
            docker compose exec -T web wget -qO- http://backend:8787/api/health
